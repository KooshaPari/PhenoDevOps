on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: Lint

permissions:
  contents: read
jobs:
  golangci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 'stable'
      - uses: golangci/golangci-lint-action@5403a413dee20909aad15f1ecb21377539fcc4df
        with:
          version: latest
