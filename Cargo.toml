[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"
description = "Phenotype Infrastructure Kit"

[workspace]
resolver = "2"
members = [
  "crates/agileplus-api",
  "crates/agileplus-api-types",
  "crates/agileplus-benchmarks",
  "crates/agileplus-cache",
  "crates/agileplus-cli",
  "crates/agileplus-contract-tests",
  "crates/agileplus-dashboard",
  "crates/agileplus-domain",
  "crates/agileplus-error-core",
  "crates/agileplus-events",
  "crates/agileplus-git",
  "crates/agileplus-github",
  "crates/agileplus-graph",
  "crates/agileplus-grpc",
  "crates/agileplus-import",
  "crates/agileplus-integration-tests",
  "crates/agileplus-nats",
  "crates/agileplus-p2p",
  "crates/agileplus-plane",
  "crates/agileplus-sqlite",
  "crates/agileplus-subcmds",
  "crates/agileplus-sync",
  "crates/agileplus-telemetry",
  "crates/agileplus-triage",
  "crates/phenotype-async-traits",
  "crates/phenotype-casbin-wrapper",
  "crates/phenotype-config-core",
  "crates/phenotype-config-loader",
  "crates/phenotype-contract",
  "crates/phenotype-contracts",
  "crates/phenotype-cost-core",
  "crates/phenotype-crypto",
  "crates/phenotype-error-core",
  "crates/phenotype-error-macros",
  "crates/phenotype-errors",
  "crates/phenotype-git-core",
  "crates/phenotype-health",
  "crates/phenotype-http-client-core",
  "crates/phenotype-iter",
  "crates/phenotype-logging",
  "crates/phenotype-macros",
  "crates/phenotype-mcp",
  "crates/phenotype-policy-engine",
  "crates/phenotype-port-traits",
  "crates/phenotype-ports-canonical",
  "crates/phenotype-process",
  "crates/phenotype-shared-config",
  "crates/phenotype-state-machine",
  "crates/phenotype-string",
  "crates/phenotype-telemetry",
  "crates/phenotype-test-infra",
  "crates/phenotype-validation",
  "agileplus-agents",
  "rust",
]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
toml = "0.8"
regex = "1"
tempfile = "3"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
strum = { version = "0.26", features = ["derive"] }
once_cell = "1.19"
blake3 = "1"
hex = "0.4"
zstd = "0.13"
unicode-normalization = "0.1"
clap-ext = { git = "https://github.com/KooshaPari/clap-ext", tag = "v0.1.0" }
[profile.dev]
opt-level = 0
debug = true
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
[package]
name = "phenodevops"
version = "0.1.0"
edition = "2021"
license = "MIT-or-Apache-2.0"
license-file = "LICENSE"
description = "PhenoDevOps — Phenotype DevOps tooling: CI/CD pipelines, agent dispatch infrastructure, dispatch MCP server, and operational automation"
homepage = "https://github.com/KooshaPari/PhenoDevOps"
documentation = "https://docs.rs/phenodevops"
repository = "https://github.com/KooshaPari/PhenoDevOps"
readme = "README.md"
publish = false
[dependencies]
sha2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
pbkdf2 = { version = "0.12", package = "pbkdf2" }
thiserror = { workspace = true }
